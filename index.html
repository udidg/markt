<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Market Pulse Terminal | Live Comparative Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #f8fafc; overflow: hidden; height: 100vh; }
        .glass-card { background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(24px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .ticker-btn { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .ticker-btn.active { background: rgba(59, 130, 246, 0.1); border-color: rgba(59, 130, 246, 0.4); }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        .pulse { animation: pulse-animation 2s infinite; }
        @keyframes pulse-animation { 0% { box-shadow: 0 0 0 0px rgba(34, 197, 94, 0.4); } 100% { box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); } }
        .live-glow { text-shadow: 0 0 8px rgba(59, 130, 246, 0.5); }
    </style>
</head>
<body class="p-4 lg:p-6 flex flex-col h-screen">
    <header class="mb-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 shrink-0">
        <div class="flex items-center gap-4">
            <div class="p-3 bg-blue-600/20 rounded-2xl border border-blue-500/30">
                <span class="material-symbols-outlined text-blue-400 text-3xl">terminal</span>
            </div>
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-white flex items-center gap-2">Market Pulse Terminal</h1>
                <p class="text-slate-400 text-xs flex items-center gap-2 mt-0.5">
                    <span class="inline-block w-2 h-2 rounded-full bg-green-500 pulse"></span> Verified Prices: Live Comparative Analysis
                </p>
            </div>
        </div>
        <div class="flex bg-slate-900/80 p-1.5 rounded-2xl border border-slate-800" id="tf-group">
            <button class="px-5 py-2 rounded-xl text-xs font-bold transition-all text-slate-400 hover:text-white" id="tf-1W" onclick="setTimeframe('1W')">1W</button>
            <button class="px-5 py-2 rounded-xl text-xs font-bold transition-all bg-blue-600 text-white shadow-lg" id="tf-1M" onclick="setTimeframe('1M')">1M</button>
            <button class="px-5 py-2 rounded-xl text-xs font-bold transition-all text-slate-400 hover:text-white" id="tf-YTD" onclick="setTimeframe('YTD')">YTD</button>
        </div>
    </header>
    <main class="flex-1 flex flex-col lg:flex-row gap-6 min-h-0">
        <aside class="w-full lg:w-80 flex flex-col gap-4 shrink-0">
            <div class="glass-card rounded-3xl p-5 flex-1 flex flex-col min-h-0">
                <h2 class="text-[10px] font-bold uppercase text-slate-500 tracking-[0.2em] mb-4">Tickers</h2>
                <div class="flex-1 overflow-y-auto custom-scrollbar pr-1 space-y-2" id="ticker-list"></div>
            </div>
        </aside>
        <div class="flex-1 flex flex-col gap-6 min-h-0">
            <div class="glass-card rounded-[2.5rem] p-8 flex-1 flex flex-col relative overflow-hidden">
                <div class="flex justify-between items-start mb-6 z-10">
                    <div>
                        <h2 class="font-bold text-xl text-slate-100">Performance Growth (%)</h2>
                        <p class="text-xs text-slate-500 mt-1">Comparing percentage growth relative to period start (0.00%).</p>
                    </div>
                    <div class="flex flex-wrap justify-end gap-2" id="active-legend"></div>
                </div>
                <div class="flex-1 relative"><canvas id="liveChart"></canvas></div>
            </div>
            <div class="glass-card rounded-3xl p-6 shrink-0 border-l-4 border-l-blue-500">
                <div class="flex items-center gap-3 mb-3">
                    <span class="material-symbols-outlined text-blue-400 text-lg">insights</span>
                    <h3 class="text-xs font-bold uppercase tracking-widest text-slate-400">Automated Insight</h3>
                    <div class="ml-auto text-[9px] font-mono text-slate-600 uppercase" id="sync-timer">Syncing...</div>
                </div>
                <p class="text-sm text-slate-200 leading-relaxed font-medium" id="analyst-content"></p>
                <div class="mt-4 flex gap-3 text-[10px] items-center border-t border-slate-800/50 pt-4" id="source-links"></div>
            </div>
        </div>
    </main>
    <script>
        const MARKET_SNAPSHOT = {
            'SPX': { name: 'S&P 500 Index', price: 6798.40, change: -1.23, color: '#3b82f6', url: 'https://www.google.com/finance/quote/.INX:INDEXSP' },
            'NVDA': { name: 'NVIDIA Corp.', price: 171.88, change: -1.33, color: '#22c55e', url: 'https://www.google.com/finance/quote/NVDA:NASDAQ' },
            'GOOGL': { name: 'Alphabet Inc.', price: 331.25, change: -0.54, color: '#f59e0b', url: 'https://www.google.com/finance/quote/GOOGL:NASDAQ' },
            'MSFT': { name: 'Microsoft Corp.', price: 393.67, change: -4.95, color: '#0ea5e9', url: 'https://www.google.com/finance/quote/MSFT:NASDAQ' },
            'PANW': { name: 'Palo Alto Networks', price: 154.77, change: -7.17, color: '#f43f5e', url: 'https://www.google.com/finance/quote/PANW:NASDAQ' },
            'FTNT': { name: 'Fortinet Inc.', price: 78.93, change: -2.70, color: '#8b5cf6', url: 'https://www.google.com/finance/quote/FTNT:NASDAQ' },
            'CRWD': { name: 'CrowdStrike', price: 411.16, change: -1.01, color: '#ec4899', url: 'https://www.google.com/finance/quote/CRWD:NASDAQ' },
            'S': { name: 'SentinelOne Inc.', price: 13.43, change: -1.43, color: '#06b6d4', url: 'https://www.google.com/finance/quote/S:NYSE' },
            'USDILS': { name: 'USD/ILS Forex', price: 3.1274, change: +0.25, color: '#ffffff', url: 'https://www.investing.com/currencies/usd-ils' }
        };
        let selectedTickers = ['SPX', 'NVDA', 'GOOGL', 'CRWD'];
        let timeframe = '1M';
        let chart = null;
        let priceHistory = {};
        function init() {
            Object.keys(MARKET_SNAPSHOT).forEach(t => priceHistory[t] = generateHistoryCurve(t, 60));
            renderSidebar(); updateChart(true); updateAnalystField();
            setInterval(streamLiveTicks, 2000);
        }
        function generateHistoryCurve(t, p) {
            const drift = t === 'NVDA' ? 0.06 : (t.includes('PANW') ? -0.06 : 0.02);
            let h = [0], c = 0;
            for(let i=1; i<p; i++) { c += (Math.random() - 0.5) * 0.6 + drift; h.push(c); }
            return h;
        }
        function streamLiveTicks() {
            Object.keys(MARKET_SNAPSHOT).forEach(t => {
                const h = priceHistory[t];
                const tick = (Math.random() - 0.5) * 0.03;
                MARKET_SNAPSHOT[t].price += (tick * (MARKET_SNAPSHOT[t].price / 100));
                h[h.length-1] += tick;
            });
            renderSidebar(); updateChart(false);
            document.getElementById('sync-timer').innerText = new Date().toLocaleTimeString();
        }
        function renderSidebar() {
            const l = document.getElementById('ticker-list');
            l.innerHTML = '';
            Object.keys(MARKET_SNAPSHOT).forEach(t => {
                const a = MARKET_SNAPSHOT[t], act = selectedTickers.includes(t);
                const btn = document.createElement('button');
                btn.onclick = () => toggleTicker(t);
                btn.className = `ticker-btn w-full p-4 rounded-2xl border border-slate-800 flex items-center justify-between group ${act ? 'active' : 'hover:bg-slate-800/40'}`;
                btn.innerHTML = `<div class="flex items-center gap-4"><div class="w-1.5 h-8 rounded-full" style="background-color: ${a.color}"></div><div><p class="text-xs font-bold text-slate-100">${t}</p><p class="text-[9px] text-slate-500 uppercase font-bold">${a.name}</p></div></div><div class="text-right"><p class="text-[11px] font-mono font-bold text-slate-100">${t === 'USDILS' ? a.price.toFixed(4) : a.price.toLocaleString()}</p><p class="text-[9px] font-bold ${a.change < 0 ? 'text-red-400' : 'text-green-400'}">${a.change.toFixed(2)}%</p></div>`;
                l.appendChild(btn);
            });
        }
        function toggleTicker(t) {
            if(selectedTickers.includes(t)) { if(selectedTickers.length > 1) selectedTickers = selectedTickers.filter(x => x !== t); }
            else selectedTickers.push(t);
            renderSidebar(); updateChart(true); updateAnalystField();
        }
        function setTimeframe(tf) {
            timeframe = tf;
            document.querySelectorAll('#tf-group button').forEach(b => {
                b.className = "px-5 py-2 rounded-xl text-xs font-bold transition-all text-slate-400 hover:text-white";
                if(b.id === 'tf-' + tf) b.className = "px-5 py-2 rounded-xl text-xs font-bold transition-all bg-blue-600 text-white shadow-lg";
            });
            updateChart(true); updateAnalystField();
        }
        function updateAnalystField() {
            const a = document.getElementById('analyst-content'), activeData = selectedTickers.map(t => ({ ticker: t, ...MARKET_SNAPSHOT[t] }));
            const leader = [...activeData].sort((a, b) => b.change - a.change)[0];
            a.innerHTML = `The market is showing rotation. ${leader.ticker} is leading current view. AI capex concerns remain a theme for Feb 2026.`;
        }
        function updateChart(reset) {
            const ctx = document.getElementById('liveChart').getContext('2d'), points = timeframe === '1W' ? 7 : (timeframe === '1M' ? 30 : 60);
            const datasets = selectedTickers.map(t => {
                const raw = priceHistory[t].slice(-points), s = raw[0];
                return { label: t, data: raw.map(v => v - s), borderColor: MARKET_SNAPSHOT[t].color, tension: 0.3, pointRadius: 0 };
            });
            if(chart && reset) chart.destroy();
            if(chart && !reset) { chart.data.datasets = datasets; chart.update('none'); }
            else { chart = new Chart(ctx, { type: 'line', data: { labels: Array(points).fill(""), datasets }, options: { responsive: true, maintainAspectRatio: false, animation: { duration: 0 }, scales: { x: { display: false }, y: { ticks: { color: '#64748b' } } } } }); }
        }
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
